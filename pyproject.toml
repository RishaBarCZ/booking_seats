[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "bcrypt>=5.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn>=0.46.0",
    "celery>=5.6.3",
    "redis>=7.4.0",
    "flower>=2.0.1",
    "email-validator>=2.3.0",
    "pwdlib[argon2]>=0.3.0",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
]

[tool.isort]
profile = "black"
line_length = 110
src_paths = ["src"]
known_first_party = [
    "api",
    "core",
    "crud",
    "migrations",
    "models",
    "schemas",
    "services",
]
known_local_folder = []
no_lines_before = ["LOCALFOLDER"]
multi_line_output = 3
use_parentheses = true
